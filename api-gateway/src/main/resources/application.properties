spring.application.name=api-gateway

server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.cloud.gateway.server.webflux.routes[0].id=customer-service-route
spring.cloud.gateway.server.webflux.routes[0].uri=lb://customer-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/customers/**


spring.cloud.gateway.server.webflux.default-filters[0].name=AddResponseHeader
spring.cloud.gateway.server.webflux.default-filters[0].args.name=X-System-Name
spring.cloud.gateway.server.webflux.default-filters[0].args.value=Api-Gateway-System